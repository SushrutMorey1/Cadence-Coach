version: "3.9"

# docker compose up   → MySQL + the app; the app starts only once MySQL is healthy.

services:
  # ── MySQL Database ──
  mysql:
    image: mysql:8.0
    container_name: cadence_coach_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-cadence}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-cadence_coach}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_PASSWORD:-cadence}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - cadence_network

  # ── FastAPI Backend ──
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cadence_coach_app
    restart: unless-stopped
    env_file: .env
    environment:
      DB_BACKEND: mysql
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-cadence}
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - audio_output:/app/audio_output
    networks:
      - cadence_network

volumes:
  mysql_data:
    driver: local
  audio_output:
    driver: local

networks:
  cadence_network:
    driver: bridge
