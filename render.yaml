# Render.com Blueprint — One-Click Deploy
# https://render.com/docs/blueprint-spec
#
# To deploy:
# 1. Push this repo to GitHub
# 2. Go to https://dashboard.render.com/blueprints
# 3. Connect the repo → Render auto-detects this file
# 4. Fill in the environment variables in the Render dashboard

services:
  - type: web
    name: cadence-coach
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: GROQ_API_KEY
        sync: false  # User must set manually in Render dashboard
      - key: AZURE_SPEECH_KEY
        sync: false
      - key: AZURE_SPEECH_REGION
        value: centralindia
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: SESSION_SECRET_KEY
        generateValue: true  # Render auto-generates a random secret
      - key: OAUTH_REDIRECT_URI
        value: https://cadence-coach.onrender.com/api/auth/callback
      - key: MYSQL_HOST
        fromDatabase:
          name: cadence-coach-db
          property: host
      - key: MYSQL_PORT
        fromDatabase:
          name: cadence-coach-db
          property: port
      - key: MYSQL_USER
        fromDatabase:
          name: cadence-coach-db
          property: user
      - key: MYSQL_PASSWORD
        fromDatabase:
          name: cadence-coach-db
          property: password
      - key: MYSQL_DATABASE
        fromDatabase:
          name: cadence-coach-db
          property: database

databases:
  - name: cadence-coach-db
    plan: free
    databaseName: cadence_coach
    user: cadence_user
