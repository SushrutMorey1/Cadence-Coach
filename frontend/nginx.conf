# ═══════════════════════════════════════════════════════════════
# Cadence Coach — Nginx Configuration
# Serves static frontend + reverse proxies /api/ to FastAPI
# ═══════════════════════════════════════════════════════════════

# ── Redirect HTTP → HTTPS ────────────────────────────────────
server {
    listen 80;
    listen [::]:80;

    # TODO: Replace with your actual domain name
    server_name your-domain.com www.your-domain.com;

    # Let's Encrypt ACME challenge — Certbot needs this
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── Main HTTPS Server Block ─────────────────────────────────
server {
    # ── HTTP/2 + SSL ─────────────────────────────────────────
    # IMPORTANT: After running Certbot, uncomment these lines
    # and comment out the listen 80 lines below.

    # listen 443 ssl;
    # listen [::]:443 ssl;
    # http2 on;

    # Temporary: listen on port 80 until SSL is configured
    # Remove these two lines once Certbot is set up:
    listen 80;
    listen [::]:80;

    # TODO: Replace with your actual domain name
    server_name your-domain.com www.your-domain.com;

    # ── SSL Certificates (Let's Encrypt / Certbot) ───────────
    # Certbot will auto-populate these. After running:
    #   sudo certbot --nginx -d your-domain.com -d www.your-domain.com
    # these paths will be filled in automatically.
    #
    # ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    # include             /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── Security Headers ─────────────────────────────────────
    add_header X-Frame-Options        "SAMEORIGIN"     always;
    add_header X-Content-Type-Options "nosniff"         always;
    add_header X-XSS-Protection       "1; mode=block"  always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # ── Gzip Compression ─────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_min_length   256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    # ── Static Files — Frontend ──────────────────────────────
    root /var/www/cadence;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;

        # Cache static assets aggressively
        location ~* \.(css|js)$ {
            expires 7d;
            add_header Cache-Control "public, immutable";
        }

        # Cache fonts & images
        location ~* \.(woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }

    # ── Reverse Proxy — FastAPI Backend ──────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Timeouts — LLM + TTS can be slow
        proxy_read_timeout    120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout    30s;

        # Allow large audio uploads (up to 30 MB)
        client_max_body_size 30m;
    }

    # ── Serve Audio Files from Backend ───────────────────────
    location /audio/ {
        proxy_pass         http://127.0.0.1:8000/audio/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;

        # Cache served audio files
        expires 1h;
        add_header Cache-Control "public";
    }

    # ── Block dotfiles (security) ────────────────────────────
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ── Logging ──────────────────────────────────────────────
    access_log /var/log/nginx/cadence_access.log;
    error_log  /var/log/nginx/cadence_error.log;
}
